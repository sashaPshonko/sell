# POST-fallback и APQ-регистрация. Тип Pagination! (не PaginationInput).
query chatMessages($pagination: Pagination!, $filter: ChatMessageFilter!) {
  chatMessages(pagination: $pagination, filter: $filter) {
    edges {
      node {
        id
        text
        createdAt
        user {
          id
          username
        }
        deal {
          id
          direction
          status
          user {
            id
            username
          }
          item {
            id
            name
          }
          chat {
            id
          }
        }
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
